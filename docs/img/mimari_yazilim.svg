<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1040" height="600" fill="#ffffff"/>

  <!-- sütun çerçeveleri -->
  <rect x="15" y="15" width="330" height="430" rx="10" fill="#f2f7fd" stroke="#2563a8"/>
  <text x="30" y="40" font-weight="600" font-size="14" fill="#2563a8">ESP32 firmware · 1 kHz</text>
  <rect x="360" y="15" width="320" height="430" rx="10" fill="#f3f9f3" stroke="#3a7d3a"/>
  <text x="375" y="40" font-weight="600" font-size="14" fill="#3a7d3a">Bilgisayar · MATLAB · deney</text>
  <rect x="695" y="15" width="330" height="430" rx="10" fill="#fbf6ea" stroke="#8a6d00"/>
  <text x="710" y="40" font-weight="600" font-size="14" fill="#8a6d00">Modeller · MATLAB</text>

  <g text-anchor="middle">
    <!-- firmware zinciri -->
    <rect x="30" y="60" width="175" height="50" rx="7" fill="#fff" stroke="#2563a8"/>
    <text x="117" y="81" font-weight="600">Sensör okuma</text><text x="117" y="99" font-size="12">PCNT · AS5600 · INA228</text>
    <rect x="30" y="135" width="175" height="50" rx="7" fill="#fff" stroke="#2563a8"/>
    <text x="117" y="156" font-weight="600">Kestirim</text><text x="117" y="174" font-size="12">θ_M, θ_L, ω_M, θ_d</text>
    <rect x="30" y="210" width="175" height="50" rx="7" fill="#fff" stroke="#2563a8"/>
    <text x="117" y="231" font-weight="600">Kontrolcü</text><text x="117" y="249" font-size="12">PID  /  P–PI (Ghaffari)</text>
    <rect x="30" y="285" width="175" height="50" rx="7" fill="#fff" stroke="#2563a8"/>
    <text x="117" y="306" font-weight="600">Güvenlik sınırları</text><text x="117" y="324" font-size="12">akım · açı · sıcaklık</text>
    <rect x="30" y="360" width="175" height="50" rx="7" fill="#fff" stroke="#2563a8"/>
    <text x="117" y="381" font-weight="600">PWM + yön</text><text x="117" y="399" font-size="12">DRV8874'e</text>

    <!-- firmware yan kutular -->
    <rect x="225" y="135" width="105" height="50" rx="7" fill="#fff" stroke="#2563a8" stroke-dasharray="5 3"/>
    <text x="277" y="156" font-size="12" font-weight="600">Yapay</text><text x="277" y="172" font-size="12">nicemleme (L)</text>
    <rect x="225" y="210" width="105" height="50" rx="7" fill="#fff" stroke="#2563a8"/>
    <text x="277" y="231" font-size="12" font-weight="600">Komut</text><text x="277" y="247" font-size="12">θ₀, kazanç, mod</text>
    <rect x="225" y="285" width="105" height="50" rx="7" fill="#fff" stroke="#2563a8"/>
    <text x="277" y="306" font-size="12" font-weight="600">Kayıt paketi</text><text x="277" y="322" font-size="12">zaman damgalı</text>

    <!-- bilgisayar -->
    <rect x="380" y="60" width="280" height="50" rx="7" fill="#fff" stroke="#3a7d3a"/>
    <text x="520" y="81" font-weight="600">Tarama betiği</text><text x="520" y="99" font-size="12">kurulum × θ₀ × kazanç × tekrar (≈ 1080 deney)</text>
    <rect x="380" y="210" width="280" height="50" rx="7" fill="#fff" stroke="#3a7d3a"/>
    <text x="520" y="231" font-weight="600">Ham kayıt + meta veri</text><text x="520" y="249" font-size="12">kurulum, kazanç, θ₀, sıcaklık, sürüm</text>
    <rect x="380" y="285" width="280" height="50" rx="7" fill="#fff" stroke="#3a7d3a"/>
    <text x="520" y="306" font-weight="600">Sınıflama (son 5 s)</text><text x="520" y="324" font-size="12">sönümlü · LC tek/çift kenarlı · kararsız</text>
    <rect x="380" y="360" width="280" height="50" rx="7" fill="#fff" stroke="#3a7d3a"/>
    <text x="520" y="381" font-weight="600">Deneysel harita ve sınır</text><text x="520" y="399" font-size="12">θ₀ × kazanç  ·  γ × ρ</text>

    <!-- modeller -->
    <rect x="740" y="60" width="270" height="50" rx="7" fill="#fff" stroke="#8a6d00"/>
    <text x="875" y="81" font-weight="600">Sistem tanılama</text><text x="875" y="99" font-size="12">R, k_t, J_M, b, F_C, K_s, 2r, ölü bant</text>
    <rect x="740" y="210" width="270" height="50" rx="7" fill="#fff" stroke="#8a6d00"/>
    <text x="875" y="231" font-weight="600">Sayısal benzetim</text><text x="875" y="249" font-size="12">iki kütle + boşluk + yerçekimi + sürtünme</text>
    <rect x="740" y="285" width="270" height="50" rx="7" fill="#fff" stroke="#8a6d00"/>
    <text x="875" y="306" font-weight="600">Simetrik DF (Ghaffari 2013)</text><text x="875" y="324" font-size="12">yerçekimsiz referans öngörü</text>
    <rect x="740" y="360" width="270" height="50" rx="7" fill="#fff8e1" stroke="#8a6d00" stroke-width="2"/>
    <text x="875" y="381" font-weight="600">İki girişli DF (önerilen)</text><text x="875" y="399" font-size="12">tek yönlü, açıya bağlı ön yük</text>

    <!-- karşılaştırma -->
    <rect x="380" y="490" width="630" height="60" rx="8" fill="#efe9f8" stroke="#6a4c9c" stroke-width="2"/>
    <text x="695" y="515" font-weight="600" font-size="14">Karşılaştırma (başarı ölçütleri B1–B7)</text>
    <text x="695" y="536" font-size="12">kritik kazanç ve açı sınırı hatası · LC frekansı ve genliği · kurulumlar arası dağılım · kaynak ayrıştırma</text>
  </g>

  <!-- firmware okları -->
  <g stroke="#444" stroke-width="1.6" fill="none">
    <line x1="117" y1="110" x2="117" y2="133" marker-end="url(#ok)"/>
    <line x1="117" y1="185" x2="117" y2="208" marker-end="url(#ok)"/>
    <line x1="117" y1="260" x2="117" y2="283" marker-end="url(#ok)"/>
    <line x1="117" y1="335" x2="117" y2="358" marker-end="url(#ok)"/>
    <line x1="225" y1="160" x2="207" y2="160" marker-end="url(#ok)" stroke-dasharray="5 3"/>
    <line x1="225" y1="235" x2="207" y2="235" marker-end="url(#ok)"/>
    <path d="M205,172 L215,172 L215,310 L223,310" marker-end="url(#ok)"/>
    <!-- tarama → komut -->
    <path d="M380,85 L352,85 L352,222 L332,222" marker-end="url(#ok)"/>
    <!-- kayıt paketi → ham kayıt (USB) -->
    <path d="M330,310 L355,310 L355,248 L378,248" marker-end="url(#ok)"/>
    <!-- bilgisayar zinciri -->
    <line x1="520" y1="260" x2="520" y2="283" marker-end="url(#ok)"/>
    <line x1="520" y1="335" x2="520" y2="358" marker-end="url(#ok)"/>
    <!-- ham kayıt → tanılama -->
    <path d="M660,222 L705,222 L705,85 L738,85" marker-end="url(#ok)"/>
    <!-- tanılama → modeller -->
    <path d="M740,102 L725,102 L725,385" />
    <line x1="725" y1="235" x2="738" y2="235" marker-end="url(#ok)"/>
    <line x1="725" y1="310" x2="738" y2="310" marker-end="url(#ok)"/>
    <line x1="732" y1="385" x2="738" y2="385" marker-end="url(#ok)"/>
    <!-- karşılaştırmaya -->
    <line x1="520" y1="410" x2="520" y2="488" marker-end="url(#ok)"/>
    <path d="M1010,235 L1018,235 L1018,470 L900,470 L900,488" marker-end="url(#ok)"/>
    <path d="M840,410 L840,488" marker-end="url(#ok)"/>
    <path d="M760,335 L760,350 L700,350 L700,488" marker-end="url(#ok)"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="292" y="203">komut</text>
    <text x="333" y="303">USB</text>
    <text x="732" y="165">tanılama verisi</text>
  </g>

  <text x="15" y="585" font-size="12" fill="#333">Firmware'deki "geri besleme kaynağı" ve "yerçekimi ileri beslemesi" seçenekleri, uzantı (O, açıya göre geri besleme harmanlama) için hazır tutulur.</text>
</svg>
