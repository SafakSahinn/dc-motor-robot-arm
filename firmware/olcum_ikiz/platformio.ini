; Adım 6 ön ölçümü: kart içi ikizin float / double süresi ve doğruluğu.
; Ana firmware'den ayrı küçük proje (sonuç metin olarak seri hatta basılır).
; Yükleme:  python -m platformio run -t upload --upload-port COM4   (bu klasörden)
; Okuma:    python oku.py COM4

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags = -O2
