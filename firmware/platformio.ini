; Robot kol kontrolcüsü — ESP32 (klasik çip, ESP32-S / NodeMCU-32S / DevKitC)
; Derleme:  pio run            Yükleme:  pio run -t upload
; Seri izleme: pio device monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags = -O2
