<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" font-family="Segoe UI, Arial, sans-serif" font-size="11">
<rect x="0" y="0" width="660" height="270" fill="#ffffff"/>
<defs><marker id="ok" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6470"/></marker></defs>
  <rect x="10" y="10" width="200" height="78" rx="6" fill="#fdf1e6" stroke="#c98a12"/>
  <text x="20" y="28" font-weight="bold">1 · Salınımı inceleyenler</text>
  <text x="20" y="46">Ghaffari 2013 (ön yük → salınım yok)</text>
  <text x="20" y="62">Kollár–Stépán 2002 (ters sarkaç, 180°)</text>
  <text x="20" y="78">Malzahn 2014 (kolda aynı sorun)</text>

  <rect x="10" y="200" width="200" height="62" rx="6" fill="#f1f3f5" stroke="#9aa3ad"/>
  <text x="20" y="218" font-weight="bold">2 · Gözlemciyle telafi</text>
  <text x="20" y="236">DOB / ESO çalışmaları (Wang 2024 …)</text>
  <text x="20" y="252">Yerçekimi yok</text>

  <rect x="450" y="10" width="200" height="78" rx="6" fill="#eaf1f9" stroke="#4a7bb0"/>
  <text x="460" y="28" font-weight="bold">3 · Motor sinyaliyle ölçüm</text>
  <text x="460" y="46">Gebler–Holtz 1998 (tork darbesi)</text>
  <text x="460" y="62">Ruderman–Iwasaki 2016 (gözlemci)</text>
  <text x="460" y="78">Giovannitti 2022 (yerçekimi)</text>

  <rect x="450" y="200" width="200" height="62" rx="6" fill="#eaf1f9" stroke="#4a7bb0"/>
  <text x="460" y="218" font-weight="bold">4 · Kalıcı hatayı düzeltme</text>
  <text x="460" y="236">Neubauer 2015: tork işareti → ofset</text>
  <text x="460" y="252">Tork = 0 iken tanımsız</text>

  <rect x="235" y="115" width="190" height="70" rx="8" fill="#e7f5ea" stroke="#2f8a4c" stroke-width="2"/>
  <text x="330" y="138" text-anchor="middle" font-weight="bold">Bu çalışma</text>
  <text x="330" y="156" text-anchor="middle">180°'de yüzü yalnız motor</text>
  <text x="330" y="172" text-anchor="middle">sinyalleriyle kestirmek</text>

  <line x1="210" y1="70" x2="250" y2="118" stroke="#5b6470" marker-end="url(#ok)"/>
  <text x="150" y="108" fill="#5b6470">sorunun yeri (180°)</text>
  <line x1="450" y1="70" x2="410" y2="118" stroke="#5b6470" marker-end="url(#ok)"/>
  <text x="430" y="108" fill="#5b6470">araçlar</text>
  <line x1="450" y1="225" x2="410" y2="182" stroke="#5b6470" marker-end="url(#ok)"/>
  <text x="400" y="212" text-anchor="end" fill="#5b6470">temel kural</text>
  <line x1="210" y1="228" x2="250" y2="182" stroke="#9aa3ad" stroke-dasharray="4 3" marker-end="url(#ok)"/>
  <text x="222" y="200" fill="#5b6470">arka plan</text>
</svg>
